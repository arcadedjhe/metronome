<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// Icônes minimalistes (remplacent lucide-react, non chargeable ici)
const Play = ({ size = 20 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20" /></svg>
);
const Pause = ({ size = 20 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" /><rect x="14" y="4" width="5" height="16" /></svg>
);
const Settings = ({ size = 20 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
);
const Volume2 = ({ size = 20, className = "" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
);


// ============================================================================
// CONSTANTES (hors du composant pour éviter les re-créations)
// ============================================================================

const SUBDIVISION_OPTIONS = {
  quarter: { name: 'Noire', symbol: '♩', label: 'Noires' },
  eighth: { name: 'Croche', symbol: '♪', label: 'Croches' },
  sixteenth: { name: 'Double-croche', symbol: '♬', label: 'Doubles-croches' },
  triplet: { name: 'Triolet de croche', symbol: '♪₃', label: 'Triolets' }
};

const AVAILABLE_SOUNDS = {
  clave: { 
    label: 'C', 
    name: 'Clave', 
    color: '#ef4444',
    icon: '🔴',
    freq: 2600,
    type: 'sine'
  },
  woodblock: { 
    label: 'W', 
    name: 'Woodblock', 
    color: '#f59e0b',
    icon: '🟡',
    freq: 1800,
    type: 'square'
  },
  cowbell: { 
    label: 'B', 
    name: 'Cowbell', 
    color: '#10b981',
    icon: '🟢',
    freq: 800,
    type: 'triangle'
  },
  kick: { 
    label: 'K', 
    name: 'Kick', 
    color: '#3b82f6',
    icon: '🔵',
    freq: 100,
    type: 'sine'
  },
  bell: {
    label: 'Bell',
    name: 'Repère',
    color: '#a855f7',
    icon: '🔔',
    freq: 3200,
    type: 'sine'
  }
};

const FREQUENCIES = {
  every: { label: '●', name: 'Toutes', color: '#10b981' },
  every_2: { label: '②', name: '/2 mesures', color: '#3b82f6' },
  every_4: { label: '④', name: '/4 mesures', color: '#8b5cf6' },
  never: { label: '○', name: 'Jamais', color: '#64748b' }
};

const FREQUENCY_ORDER = ['every', 'every_2', 'every_4', 'never'];

const DEFAULT_VOLUMES = {
  clave: 0.3,
  woodblock: 0.25,
  cowbell: 0.3,
  kick: 0.5,
  bell: 0.7
};

// ============================================================================
// COMPOSANT PRINCIPAL
// ============================================================================

const MetronomeInterieur = () => {
  // ==========================================================================
  // STATES
  // ==========================================================================
  
  const [tempo, setTempo] = useState(120);
  const [isPlaying, setIsPlaying] = useState(false);
  const [currentMeasure, setCurrentMeasure] = useState(1);
  const [currentSubdivision, setCurrentSubdivision] = useState(0);
  const [soundSelectorOpen, setSoundSelectorOpen] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  
  // Clic repère pour grilles d'accords
  const [beaconInterval, setBeaconInterval] = useState('none');
  const [bellType, setBellType] = useState('harmonic');
  
  // Signature rythmique
  const [numerator, setNumerator] = useState(4);
  const [denominator, setDenominator] = useState(4);
  
  // Subdivision affichée
  const [subdivision, setSubdivision] = useState('eighth');
  
  // Volumes
  const [soundVolumes, setSoundVolumes] = useState(DEFAULT_VOLUMES);
  
  // Largeur réelle disponible pour la grille de subdivisions (mesurée en direct,
  // pour calculer combien de pas tiennent par ligne sans passer sous la taille minimale lisible)
  const [gridWidth, setGridWidth] = useState(0);
  
  // ==========================================================================
  // REFS (pour le scheduler audio)
  // ==========================================================================
  
  const audioContextRef = useRef(null);
  const currentNoteRef = useRef(0);
  const nextNoteTimeRef = useRef(0);
  const currentMeasureRef = useRef(1);
  const schedulerIntervalRef = useRef(null);
  const gridMeasureRef = useRef(null);
  
  // ==========================================================================
  // CALCULS MEMOÏSÉS (éviter recalculs inutiles)
  // ==========================================================================
  
  // Calculer le nombre total de subdivisions
  const totalSubdivisions = useMemo(() => {
    const quartersInMeasure = denominator === 2 ? numerator * 2 
      : denominator === 4 ? numerator 
      : numerator / 2;
    
    switch(subdivision) {
      case 'quarter': return Math.round(quartersInMeasure);
      case 'eighth': return Math.round(quartersInMeasure * 2);
      case 'sixteenth': return Math.round(quartersInMeasure * 4);
      case 'triplet': return Math.round(quartersInMeasure * 3);
      default: return Math.round(quartersInMeasure * 2);
    }
  }, [numerator, denominator, subdivision]);
  
  // Calculer les subdivisions (structure de données)
  const subdivisions = useMemo(() => {
    const subs = [];
    
    // Helper: calculer unités à labelliser
    const getUnitsToLabel = () => {
      if (denominator === 4) return numerator;
      if (denominator === 2) return numerator;
      if (denominator === 8) {
        return subdivision === 'quarter' ? Math.round(numerator / 2) : numerator;
      }
      return numerator;
    };
    
    const unitsToLabel = getUnitsToLabel();
    const subsPerUnit = totalSubdivisions / unitsToLabel;
    
    for (let i = 0; i < totalSubdivisions; i++) {
      const unitNum = Math.floor(i / subsPerUnit) + 1;
      const posInUnit = i % subsPerUnit;
      
      let label, defaultFreq, defaultSound;
      
      // Génération des labels selon subdivision
      if (subdivision === 'quarter') {
        label = String(unitNum);
        defaultFreq = Math.floor(posInUnit) === 0 ? 'every' : 'never';
        defaultSound = (unitNum - 1) % 2 === 0 ? 'clave' : 'woodblock';
      } else if (subdivision === 'eighth') {
        label = Math.floor(posInUnit) === 0 ? String(unitNum) : '∧';
        defaultFreq = Math.floor(posInUnit) === 0 ? 'every' : 'never';
        defaultSound = (unitNum - 1) % 2 === 0 ? 'clave' : 'woodblock';
      } else if (subdivision === 'sixteenth') {
        const relativePos = Math.floor((posInUnit / subsPerUnit) * 4);
        const posLabels = [String(unitNum), 'e', '∧', 'a'];
        label = posLabels[Math.min(relativePos, 3)];
        defaultFreq = Math.floor(posInUnit) === 0 ? 'every' : 'never';
        defaultSound = (unitNum - 1) % 2 === 0 ? 'clave' : 'woodblock';
      } else {
        const relativePos = Math.floor((posInUnit / subsPerUnit) * 3);
        label = String(Math.min(relativePos + 1, 3));
        defaultFreq = Math.floor(posInUnit) === 0 ? 'every' : 'never';
        defaultSound = (unitNum - 1) % 2 === 0 ? 'clave' : 'woodblock';
      }
      
      subs.push({ position: i, frequency: defaultFreq, label, sound: defaultSound });
    }
    
    return subs;
  }, [numerator, denominator, subdivision, totalSubdivisions]);
  
  // State pour les subdivisions (peut être modifié par l'utilisateur)
  const [currentSubdivisions, setCurrentSubdivisions] = useState(subdivisions);
  
  // Mettre à jour quand la configuration change
  useEffect(() => {
    setCurrentSubdivisions(subdivisions);
  }, [subdivisions]);
  
  // Filet de sécurité : le rendu qui suit immédiatement un changement de numérateur/
  // dénominateur/subdivision voit déjà le nouveau totalSubdivisions, mais currentSubdivisions
  // (mis à jour par l'effet ci-dessus) n'a pas encore la bonne longueur ce même rendu.
  // Sans ce filet, la grille indexe au-delà du tableau et plante (écran noir).
  const safeSubdivisions = currentSubdivisions.length === totalSubdivisions
    ? currentSubdivisions
    : subdivisions;
  
  // ==========================================================================
  // INITIALISATION AUDIO
  // ==========================================================================
  
  useEffect(() => {
    // Créer contexte audio au premier rendu
    if (!audioContextRef.current) {
      audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    // Cleanup au démontage
    return () => {
      if (audioContextRef.current && audioContextRef.current.state !== 'closed') {
        audioContextRef.current.close();
      }
    };
  }, []);
  
  // Mesurer en direct la largeur disponible pour la grille (résiste à la rotation
  // d'écran, au redimensionnement de fenêtre, etc. — pas de valeur devinée)
  useEffect(() => {
    const el = gridMeasureRef.current;
    if (!el) return;
    
    const observer = new ResizeObserver((entries) => {
      const width = entries[0]?.contentRect?.width;
      if (width) setGridWidth(width);
    });
    
    observer.observe(el);
    return () => observer.disconnect();
  }, []);
  
  // ==========================================================================
  // FONCTIONS AUDIO (useCallback pour stabilité)
  // ==========================================================================
  
  const playSound = useCallback((time, soundType, isStrong) => {
    const ctx = audioContextRef.current;
    if (!ctx) return;
    
    const soundConfig = AVAILABLE_SOUNDS[soundType];
    if (!soundConfig) return;
    
    const baseVolume = soundVolumes[soundType] || 0.3;
    const volumeMultiplier = isStrong ? 1.15 : 1.0;
    const finalVolume = baseVolume * volumeMultiplier;
    
    // === KICK ===
    if (soundType === 'kick') {
      const oscillator = ctx.createOscillator();
      const gainNode = ctx.createGain();
      
      oscillator.frequency.setValueAtTime(soundConfig.freq, time);
      oscillator.frequency.exponentialRampToValueAtTime(40, time + 0.1);
      oscillator.type = 'sine';
      
      gainNode.gain.setValueAtTime(finalVolume, time);
      gainNode.gain.exponentialRampToValueAtTime(0.01, time + 0.3);
      
      oscillator.connect(gainNode);
      gainNode.connect(ctx.destination);
      
      oscillator.start(time);
      oscillator.stop(time + 0.3);
      return;
    }
    
    // === COWBELL ===
    if (soundType === 'cowbell') {
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc1.frequency.value = 800;
      osc2.frequency.value = 540;
      osc1.type = 'square';
      osc2.type = 'square';
      
      gain.gain.setValueAtTime(finalVolume, time);
      gain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);
      
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);
      
      osc1.start(time);
      osc2.start(time);
      osc1.stop(time + 0.15);
      osc2.stop(time + 0.15);
      return;
    }
    
    // === BELL (3 types) ===
    if (soundType === 'bell') {
      if (bellType === 'harmonic') {
        // Bell 1: Cloche harmonique
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const osc3 = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc1.frequency.value = 3200;
        osc2.frequency.value = 4800;
        osc3.frequency.value = 6400;
        osc1.type = osc2.type = osc3.type = 'sine';
        
        gain.gain.setValueAtTime(finalVolume * 1.2, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
        
        osc1.connect(gain);
        osc2.connect(gain);
        osc3.connect(gain);
        gain.connect(ctx.destination);
        
        osc1.start(time);
        osc2.start(time);
        osc3.start(time);
        osc1.stop(time + 0.1);
        osc2.stop(time + 0.1);
        osc3.stop(time + 0.1);
        return;
      } else if (bellType === 'click') {
        // Bell 2: Click percussif
        const bufferSize = ctx.sampleRate * 0.05;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 2000;
        
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(finalVolume * 1.5, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
        
        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        
        source.start(time);
        source.stop(time + 0.05);
        return;
      } else if (bellType === 'block') {
        // Bell 3: Temple block
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        const gain2 = ctx.createGain();
        const mainGain = ctx.createGain();
        
        osc1.frequency.value = 200;
        osc1.type = 'square';
        gain1.gain.setValueAtTime(finalVolume * 0.8, time);
        gain1.gain.exponentialRampToValueAtTime(0.01, time + 0.08);
        
        osc2.frequency.value = 3500;
        osc2.type = 'sine';
        gain2.gain.setValueAtTime(finalVolume * 1.2, time);
        gain2.gain.exponentialRampToValueAtTime(0.01, time + 0.08);
        
        osc1.connect(gain1);
        osc2.connect(gain2);
        gain1.connect(mainGain);
        gain2.connect(mainGain);
        mainGain.connect(ctx.destination);
        
        osc1.start(time);
        osc2.start(time);
        osc1.stop(time + 0.08);
        osc2.stop(time + 0.08);
        return;
      }
    }
    
    // === CLAVE / WOODBLOCK (par défaut) ===
    const oscillator = ctx.createOscillator();
    const gainNode = ctx.createGain();
    
    const freqMultiplier = isStrong ? 1.15 : 1.0;
    oscillator.frequency.value = soundConfig.freq * freqMultiplier;
    oscillator.type = soundConfig.type;
    
    const duration = soundType === 'clave' ? 0.05 : 0.08;
    
    gainNode.gain.setValueAtTime(finalVolume, time);
    gainNode.gain.exponentialRampToValueAtTime(0.01, time + duration);
    
    oscillator.connect(gainNode);
    gainNode.connect(ctx.destination);
    
    oscillator.start(time);
    oscillator.stop(time + duration);
  }, [soundVolumes, bellType]);
  
  const previewSound = useCallback((soundType) => {
    const ctx = audioContextRef.current;
    if (!ctx) return;
    playSound(ctx.currentTime, soundType, false);
  }, [playSound]);
  
  // ==========================================================================
  // FONCTIONS DE CONTRÔLE (useCallback)
  // ==========================================================================
  
  const shouldPlayNote = useCallback((subdivisionIndex, measureNumber) => {
    const freq = currentSubdivisions[subdivisionIndex]?.frequency;
    if (!freq) return false;
    
    switch(freq) {
      case 'every': return true;
      case 'every_2': return (measureNumber % 2) === 1;
      case 'every_4': return ((measureNumber - 1) % 4) === 0;
      case 'never': return false;
      default: return false;
    }
  }, [currentSubdivisions]);
  
  const toggleFrequency = useCallback((index) => {
    setCurrentSubdivisions(prev => {
      const newSubs = [...prev];
      const currentFreq = newSubs[index].frequency;
      const currentIndex = FREQUENCY_ORDER.indexOf(currentFreq);
      const nextIndex = (currentIndex + 1) % FREQUENCY_ORDER.length;
      newSubs[index].frequency = FREQUENCY_ORDER[nextIndex];
      return newSubs;
    });
  }, []);
  
  const changeSound = useCallback((index, newSound) => {
    setCurrentSubdivisions(prev => {
      const newSubs = [...prev];
      newSubs[index].sound = newSound;
      return newSubs;
    });
    setSoundSelectorOpen(null);
  }, []);
  
  const openSoundSelector = useCallback((index) => {
    setSoundSelectorOpen(index);
  }, []);
  
  const changeSoundVolume = useCallback((soundType, volume) => {
    setSoundVolumes(prev => ({ ...prev, [soundType]: volume }));
  }, []);
  
  const resetVolumes = useCallback(() => {
    setSoundVolumes(DEFAULT_VOLUMES);
  }, []);
  
  // ==========================================================================
  // SCHEDULER AUDIO (Coeur du métronome)
  // ==========================================================================
  
  const scheduler = useCallback(() => {
    const ctx = audioContextRef.current;
    if (!ctx) return;
    
    const secondsPerBeat = 60.0 / tempo;
    
    let secondsPerSubdivision;
    switch(subdivision) {
      case 'quarter': secondsPerSubdivision = secondsPerBeat; break;
      case 'eighth': secondsPerSubdivision = secondsPerBeat / 2; break;
      case 'sixteenth': secondsPerSubdivision = secondsPerBeat / 4; break;
      case 'triplet': secondsPerSubdivision = secondsPerBeat / 3; break;
      default: secondsPerSubdivision = secondsPerBeat / 2;
    }
    
    const scheduleAheadTime = 0.1;
    
    while (nextNoteTimeRef.current < ctx.currentTime + scheduleAheadTime) {
      const noteIndex = currentNoteRef.current % totalSubdivisions;
      const measureNum = currentMeasureRef.current;
      
      // Jouer le pattern normal
      if (shouldPlayNote(noteIndex, measureNum)) {
        const soundType = (currentSubdivisions[noteIndex] || subdivisions[noteIndex])?.sound;
        
        // Calculer unités pour temps forts
        const getUnitsToLabel = () => {
          if (denominator === 4) return numerator;
          if (denominator === 2) return numerator;
          if (denom
